name: release
# Релиз по тегу vX.Y.Z (#8): тесты, архив udr-amnezia-vX.Y.Z.tar.gz и SHA256SUMS в GitHub Release.
# Канал stable (install.sh, панель) ставит последний релиз и сверяет сумму архива.
# Если релиз с этим тегом уже создан вручную — архив и суммы дозагружаются в него, описание берётся из CHANGELOG.
# Ручной запуск (Actions → release → Run workflow, тег) — пересобрать архив для существующего тега.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег, например v1.5.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Тег допустим
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::тег $TAG — не vX.Y.Z"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Тег совпадает с VERSION и install.sh
        run: |
          ver=${TAG#v}
          [ "$(cat VERSION)" = "$ver" ] || { echo "::error::VERSION=$(cat VERSION), тег $TAG"; exit 1; }
          grep -qx "INSTALLER_VERSION=$ver" install.sh || { echo "::error::INSTALLER_VERSION в install.sh не $ver"; exit 1; }
          grep -q "^## $ver\b" CHANGELOG.md || { echo "::error::в CHANGELOG.md нет раздела «## $ver»"; exit 1; }
          if [ -f awg/web/awgweb/core.py ]; then
            grep -qx "VERSION = \"$ver\"" awg/web/awgweb/core.py || { echo "::error::VERSION панели (awg/web/awgweb/core.py) не $ver"; exit 1; }
          fi
      - name: Тесты
        run: |
          for f in install.sh awg/*.sh server/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
          shellcheck -S warning install.sh awg/*.sh server/*.sh tests/*.sh
          bash tests/run.sh
          [ "$(cut -d' ' -f1 install.sh.sha256)" = "$(sha256sum install.sh | cut -d' ' -f1)" ]
          python3 tools/sync-guide.py --check
      - name: Архив и контрольные суммы
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="udr-amnezia-$TAG/" -o "dist/udr-amnezia-$TAG.tar.gz" "$TAG"
          ( cd dist && sha256sum "udr-amnezia-$TAG.tar.gz" > SHA256SUMS && cat SHA256SUMS )
          ver=${TAG#v}
          awk -v v="$ver" '$0 ~ "^## "v"([^0-9.]|$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > dist/notes.md
          printf '\n---\nУстановка и обновление: канал stable ставит этот релиз и проверяет SHA256 архива.\n```bash\nbash <(curl -fsSL https://raw.githubusercontent.com/%s/%s/install.sh) --update\n```\n' "$GITHUB_REPOSITORY" "$TAG" >> dist/notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "релиз $TAG уже есть: загружаю архив и суммы, описание — из CHANGELOG"
            gh release upload "$TAG" "dist/udr-amnezia-$TAG.tar.gz" dist/SHA256SUMS --clobber
            gh release edit "$TAG" --title "UDR-Amnezia ${TAG#v}" --notes-file dist/notes.md --draft=false
          else
            gh release create "$TAG" "dist/udr-amnezia-$TAG.tar.gz" dist/SHA256SUMS --title "UDR-Amnezia ${TAG#v}" --notes-file dist/notes.md --verify-tag
          fi
      - name: Проверка как у канала stable — архив скачивается, сумма совпадает
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p chk && cd chk
          gh release download "$TAG" -p "udr-amnezia-$TAG.tar.gz" -p SHA256SUMS
          sha256sum -c SHA256SUMS
