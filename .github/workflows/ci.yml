name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Синтаксис bash
        run: for f in install.sh awg/*.sh server/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: shellcheck (предупреждения блокируют, #17)
        run: |
          shellcheck --version
          shellcheck -S warning install.sh awg/*.sh server/*.sh tests/*.sh
      - name: Тесты на заглушках (без роутера)
        run: bash tests/run.sh
      - name: Контрольная сумма install.sh для --self-update
        run: |
          [ "$(cut -d' ' -f1 install.sh.sha256)" = "$(sha256sum install.sh | cut -d' ' -f1)" ] || {
            echo "::error::install.sh.sha256 устарел. Обновите: sha256sum install.sh > install.sh.sha256"; exit 1; }
      - name: Бинарники только из официальных исходников
        run: |
          ! grep -R -n -i "djgreez" install.sh awg server
      - name: Гайд index.html совпадает со скриптами
        run: python3 tools/sync-guide.py --check

  # Панель, бот и Home Assistant на всех поддерживаемых Python (#16): на роутерах UniFi бывает 3.7–3.11
  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Тесты панели, бота и Home Assistant на Python ${{ matrix.python }}
        run: |
          python3 --version
          python3 tests/t_web.py
          python3 tests/t_bot.py
          python3 tests/t_ha.py

  # Весь набор на aarch64, как на UDR7: Debian 11 и Python 3.9 (#16). Нативный ARM-раннер GitHub — быстрее эмуляции qemu.
  arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: 'Пакеты как на роутере — bash, python3, openssl, curl'
        run: |
          # Debian 11 после окончания LTS переезжает в archive.debian.org — тогда берём пакеты оттуда
          if ! apt-get update -qq; then
            sed -i -e 's|deb.debian.org|archive.debian.org|g' -e 's|security.debian.org|archive.debian.org|g' -e '/bullseye-updates/d' /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq
          fi
          apt-get install -y -qq --no-install-recommends ca-certificates git python3 openssl curl procps iproute2 iptables hostname util-linux
          uname -m; python3 --version
      - uses: actions/checkout@v4
      - name: Тесты на заглушках (aarch64)
        run: bash tests/run.sh
